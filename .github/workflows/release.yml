name: Crea installer e release

# Parte da solo a ogni push su main: se la VERSION in app/config.py non ha ancora una release, crea l'installer e la pubblica.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Leggi la versione
        id: version
        shell: pwsh
        run: |
          $version = python -c "import re;print(re.search(r'VERSION\s*=\s*\x22([^\x22]+)\x22', open('app/config.py', encoding='utf-8').read()).group(1))"
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Controlla se la release esiste gia'
        id: check
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "v${{ steps.version.outputs.version }}" --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) { "exists=true" >> $env:GITHUB_OUTPUT } else { "exists=false" >> $env:GITHUB_OUTPUT }
          exit 0

      - uses: actions/setup-python@v5
        if: steps.check.outputs.exists == 'false'
        with:
          python-version: "3.12"

      - name: Installa Inno Setup
        if: steps.check.outputs.exists == 'false'
        run: choco install innosetup -y --no-progress

      - name: Crea Sonus.exe e l'installer
        if: steps.check.outputs.exists == 'false'
        run: python sonus_build.py --ci

      - name: Copia con nome fisso (link di download sempre uguale)
        if: steps.check.outputs.exists == 'false'
        shell: pwsh
        run: Copy-Item "installer\Sonus_Setup_v${{ steps.version.outputs.version }}.exe" installer\Sonus_Setup.exe

      - name: Pubblica la release
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Sonus ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            installer/Sonus_Setup_v${{ steps.version.outputs.version }}.exe
            installer/Sonus_Setup.exe
          generate_release_notes: true
