name: Android - crea APK e release

# Parte a ogni push sul branch android-app. Crea la release "android-vX.Y.Z" con l'APK dentro (versione = versionName in
# android/app/build.gradle.kts). E' una PRE-RELEASE: cosi' non diventa mai la "latest release" che usa l'app per PC per aggiornarsi.
# Non crea nessuna release di Windows (quella parte solo da main).
on:
  push:
    branches: [android-app]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Leggi la versione
        id: version
        run: echo "name=$(grep -oP 'versionName = "\K[^"]+' android/app/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Crea l'APK
        run: gradle -p android assembleRelease --no-daemon --stacktrace

      - name: Prepara il file
        run: cp android/app/build/outputs/apk/release/app-release.apk "Sonus-${{ steps.version.outputs.name }}.apk"

      - name: Salva l'APK
        uses: actions/upload-artifact@v4
        with:
          name: Sonus-APK
          path: Sonus-${{ steps.version.outputs.name }}.apk

      - name: Pubblica la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-v${{ steps.version.outputs.name }}"
          FILE="Sonus-${{ steps.version.outputs.name }}.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" --clobber
          else
            gh release create "$TAG" "$FILE" --target "$GITHUB_SHA" --prerelease \
              --title "Sonus per Android ${{ steps.version.outputs.name }}" \
              --notes "App Sonus per Android. Scarica l'APK qui sotto e installalo. Le versioni nuove arrivano da sole dentro l'app."
          fi
